<h1>Controls whether the new HTML parser behavior for the <select> element is enabled (obsolete)</h1>

<h3>Category</h3>

<p>Computer Configuration > Administrative Templates > Microsoft Edge</p>

<h3>Scope</h3>

<p>Both</p>

<h3>Registry Key</h3>

<p>HKLM\Software\Policies\Microsoft\Edge</p>

<h3>Description</h3>

<p>OBSOLETE: This policy is obsolete and doesn't work after Microsoft Edge 138.

The HTML parser is being changed to allow additional HTML tags inside the <select> element. This policy supports the old HTML parser behavior through Microsoft Edge version 138.

If this policy is enabled or unset, the HTML parser allows additional tags inside the <select> element.

If this policy is disabled, then the HTML parser restricts which tags can be put in the <select> element.</p>
