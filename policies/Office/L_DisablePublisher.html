<h1>Disable Publisher</h1>

<h3>Category</h3>

<p>User Configuration > Administrative Templates > Microsoft Publisher 2016</p>

<h3>Scope</h3>

<p>User</p>

<h3>Registry Key</h3>

<p>HKCU\software\policies\microsoft\office\16.0\publisher</p>

<h3>Description</h3>

<p>This policy setting controls whether Publisher will be blocked from starting. </p>
