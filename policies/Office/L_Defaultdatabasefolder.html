<h1>Default database folder</h1>

<h3>Category</h3>

<p>User Configuration > Administrative Templates > Microsoft Access 2016 > Application Settings > General</p>

<h3>Scope</h3>

<p>User</p>

<h3>Registry Key</h3>

<p>HKCU\software\policies\microsoft\office\16.0\access\settings</p>

<h3>Description</h3>

<p>Specifies the default working folder.</p>
