<h1>Disable audio search</h1>

<h3>Category</h3>

<p>User Configuration > Administrative Templates > Microsoft OneNote 2016 > OneNote Options > Audio and Video</p>

<h3>Scope</h3>

<p>User</p>

<h3>Registry Key</h3>

<p>HKCU\software\policies\microsoft\office\16.0\onenote\options\other</p>

<h3>Description</h3>

<p>Disables OneNote audio search feature.</p>
