<h1>Default File Location</h1>

<h3>Category</h3>

<p>User Configuration > Administrative Templates > Microsoft Word 2016 > Word Options > Advanced > File Locations</p>

<h3>Scope</h3>

<p>User</p>

<h3>Registry Key</h3>

<p>HKCU\software\policies\microsoft\office\16.0\word\options</p>

<h3>Description</h3>

<p>Defines the default path to documents.</p>
