<h1>Default background graphics printing mode</h1>

<h3>Category</h3>

<p>Computer Configuration > Administrative Templates > Google Chrome > Printing</p>

<h3>Scope</h3>

<p>Both</p>

<h3>Registry Key</h3>

<p>HKLM\Software\Policies\Google\Chrome</p>

<h3>Description</h3>

<p>Overrides default background graphics printing mode.

Example value: enabled</p>
